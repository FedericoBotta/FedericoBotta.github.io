<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Option 3 — Diversity Index</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;600;700&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #060f09; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }

    .overlay {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 45%;
      background: linear-gradient(to top, rgba(6,15,9,0.97) 0%, rgba(6,15,9,0.6) 55%, transparent 100%);
      pointer-events: none;
    }

    .content {
      position: fixed;
      bottom: 4.5rem;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      max-width: 760px;
      padding: 0 1.5rem;
    }

    .content h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(1.6rem, 3.5vw, 2.7rem);
      color: #fff;
      line-height: 1.2;
      margin-bottom: 0.8rem;
    }

    .content p {
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.4);
      font-style: italic;
    }

    .badge {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: rgba(52,211,153,0.15);
      border: 1px solid rgba(52,211,153,0.35);
      color: #34d399;
      padding: 0.3em 1em;
      border-radius: 100px;
      margin-bottom: 1rem;
    }

    .option-label {
      position: fixed;
      top: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(52,211,153,0.7);
      background: rgba(6,15,9,0.7);
      padding: 0.4em 1.2em;
      border-radius: 100px;
      border: 1px solid rgba(52,211,153,0.2);
    }

    .desc {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay"></div>

<div class="option-label">Option 3 — Shannon Diversity Index</div>

<div class="content">
  <span class="badge">Perspective · PNAS Nexus 2026</span>
  <h1>Urban vibrancy: An analogy of biodiversity, retail diversity, and activity-based urban diversity measures</h1>
  <p>Yiu · Pacheco · Di Clemente · Botta</p>
</div>

<div class="desc">13 activity bars — balanced heights = high Shannon entropy = vibrant city</div>

<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  let W, H;

  const COLORS = [
    '#34d399','#fb923c','#60a5fa','#f472b6','#a78bfa',
    '#fbbf24','#f87171','#6ee7b7','#c084fc','#5eead4',
    '#fcd34d','#93c5fd','#86efac'
  ];

  // Each bar oscillates with a unique frequency and phase
  const FREQS  = [0.28,0.61,0.44,0.37,0.54,0.71,0.32,0.50,0.41,0.59,0.23,0.47,0.35];
  const PHASES = COLORS.map((_, i) => i * (Math.PI * 2 / 13));
  const BIASES = [0.48,0.56,0.51,0.53,0.49,0.43,0.39,0.47,0.53,0.40,0.45,0.51,0.45];

  // Rising particles per bar
  let particles = [];

  function initParticles() {
    particles = [];
    for (let s = 0; s < 13; s++) {
      for (let i = 0; i < 22; i++) {
        particles.push({
          s,
          xOff: 0.1 + Math.random() * 0.8, // fraction within bar
          y:    Math.random(),               // fraction of canvas height (0=top,1=bot)
          spd:  0.0008 + Math.random() * 0.0012,
        });
      }
    }
  }

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    initParticles();
  }

  function shannon(levels) {
    const total = levels.reduce((a, b) => a + b, 0);
    return -levels.reduce((h, l) => {
      const p = l / total;
      return p > 1e-9 ? h + p * Math.log(p) : h;
    }, 0);
  }

  const H_MAX = Math.log(13);
  let t = 0;

  function tick() {
    t += 0.01;

    // Compute levels
    const levels = BIASES.map((b, i) => Math.max(0.05, b + 0.33 * Math.sin(FREQS[i] * t + PHASES[i])));

    const H_val   = shannon(levels);
    const vibrancy = H_val / H_MAX; // 0–1

    // Clear with faint trail
    ctx.fillStyle = 'rgba(6,15,9,0.3)';
    ctx.fillRect(0, 0, W, H);

    // Central radial glow — brightens when all bars balanced
    const glowR = Math.min(W, H) * 0.65;
    const grd   = ctx.createRadialGradient(W / 2, H * 0.42, 0, W / 2, H * 0.42, glowR);
    grd.addColorStop(0,   `rgba(52,211,153,${(vibrancy * 0.18).toFixed(3)})`);
    grd.addColorStop(0.5, `rgba(52,211,153,${(vibrancy * 0.06).toFixed(3)})`);
    grd.addColorStop(1,   'rgba(52,211,153,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    const padL = 24, padR = 24, padT = 70, padB = 60;
    const cW   = W - padL - padR;
    const cH   = H - padT - padB;
    const bw   = cW / 13;

    // Draw each bar
    for (let s = 0; s < 13; s++) {
      const lv  = levels[s];
      const bh  = lv * cH;
      const bx  = padL + s * bw;
      const by  = padT + cH - bh;

      // Bar fill gradient
      const grad = ctx.createLinearGradient(bx, padT + cH, bx, by);
      grad.addColorStop(0,   COLORS[s] + '08');
      grad.addColorStop(0.5, COLORS[s] + '44');
      grad.addColorStop(1,   COLORS[s] + 'bb');
      ctx.fillStyle = grad;
      ctx.fillRect(bx + 2, by, bw - 4, bh);

      // Top glow line
      ctx.fillStyle = COLORS[s];
      ctx.globalAlpha = 0.95;
      ctx.fillRect(bx + 2, by - 2, bw - 4, 3);
      ctx.globalAlpha = 1;

      // Top halo
      const halo = ctx.createLinearGradient(bx, by - 30, bx, by + 10);
      halo.addColorStop(0, 'transparent');
      halo.addColorStop(0.6, COLORS[s] + '30');
      halo.addColorStop(1,   'transparent');
      ctx.fillStyle = halo;
      ctx.fillRect(bx, by - 30, bw, 40);
    }

    // Rising particles
    for (const p of particles) {
      const lv      = levels[p.s];
      const bw_     = cW / 13;
      const bx_     = padL + p.s * bw_;
      const barTopY = padT + cH * (1 - lv);
      const baseFY  = padT + cH;

      // Move upward (faster when bar is taller)
      p.y -= p.spd * (0.4 + lv * 1.2);
      if (p.y < 0) p.y = 1;

      // Actual canvas y
      const py = padT + p.y * cH;
      if (py < barTopY || py > baseFY) continue;

      const px = bx_ + 2 + p.xOff * (bw_ - 4);
      // Fade near top of bar
      const alpha = 0.45 * ((py - barTopY) / (baseFY - barTopY));

      ctx.beginPath();
      ctx.arc(px, py, 1.4, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.globalAlpha = alpha;
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Shannon entropy readout
    const hLabel = `H = ${H_val.toFixed(2)}  /  Hₘₐₓ = ${H_MAX.toFixed(2)}`;
    ctx.font      = `bold 12px Inter, monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(52,211,153,${(0.35 + vibrancy * 0.65).toFixed(2)})`;
    ctx.fillText(hLabel, W / 2, 40);

    // Vibrancy bar under label
    const vbW = 180, vbH = 4, vbX = W / 2 - vbW / 2, vbY = 48;
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(vbX, vbY, vbW, vbH);
    const vbGrad = ctx.createLinearGradient(vbX, 0, vbX + vbW, 0);
    vbGrad.addColorStop(0, '#7dd3fc');
    vbGrad.addColorStop(0.5, '#34d399');
    vbGrad.addColorStop(1, '#34d399');
    ctx.fillStyle = vbGrad;
    ctx.globalAlpha = 0.5 + vibrancy * 0.5;
    ctx.fillRect(vbX, vbY, vbW * vibrancy, vbH);
    ctx.globalAlpha = 1;

    // Axis baseline
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth   = 1;
    ctx.beginPath();
    ctx.moveTo(padL, padT + cH);
    ctx.lineTo(W - padR, padT + cH);
    ctx.stroke();

    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
